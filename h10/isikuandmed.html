<form action="#" method="post">

<fieldset>

<legend>Isikuandmed</legend>

<p>
<label for="eesnimi"><b>Eesnimi</b></label><br>

<input
type="text"
id="eesnimi"
name="eesnimi"
maxlength="30"
placeholder="nt Mario"
required>

<br>

(Nõutud)

</p>


<p>
<label for="perenimi"><b>Perenimi</b></label><br>

<input
type="text"
id="perenimi"
name="perenimi"
maxlength="30"
placeholder="nt Metshein"
required>

<br>

(Nõutud)

</p>


<p>

<label for="synnikuupaev"><b>Sünnikuupäev</b></label><br>

<input
type="date"
id="synnikuupaev"
name="synnikuupaev"
min="1950-01-01"
max="2025-12-31"
value="1980-01-01"
required>

<br>

(Nõutud)

</p>


<p>

<b>Sugu</b><br>

<label>
<input type="radio" name="sugu" value="naine" required>
Naine
</label>

<label>
<input type="radio" name="sugu" value="mees">
Mees
</label>

<label>
<input type="radio" name="sugu" value="muu">
Muu
</label>

</p>
