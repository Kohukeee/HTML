<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÕPILASE REGISTREERIMISVORM</title>
</head>
<body>

    <h1>ÕPILASE REGISTREERIMISVORM</h1>

<form action="#" method="post">
  <fieldset>
    <legend>Isikuandmed</legend><br>
    <label for="Eesnimi">Eesnimi: </label><br>
    <input id="Eesnimi" name="Eesnimi" type="text"><br><br>
    <label for="Perekonnanimi">Perekonnanimi: </label><br>
    <input id="Perekonnanimi" name="Perekonnanimi" type="text"><br><br>
    <label for="date">Sünnikuupäev </label><br>
    <input id="date" name="date" type="date" min="2025-01-01" max="2025-12-31"><br><br>
    <label id="Sugu">Sugu </label><br>
    <input type="radio" name="sugu" value="Naine"> Naine
    <input type="radio" name="sugu" value="Mees" checked> Mees
    <input type="radio" name="sugu" value="Muu" checked> Muu
  </fieldset>
</form>

<form action="#" method="post">
  <fieldset>
    <legend>Kontakt</legend><br>
    <label for="email">E-Post: </label><br>
    <input id="email" name="email" type="email" placeholder="nt Henry@kool.ee"><br><br>
    <label for="tel">Telefon: </label><br>
    <input id="tel" name="tel" type="tel" pattern="\+372[0-9]{7,8}" placeholder="+372 56555054"><br><br>
    <label id="aadress">Aadress </label><br>
    <textarea name="aadress" rows="4" cols="30" placeholder="Tänav, maja, korter"></textarea><br><br>
    <label for="linn">Linn / asula </label><br>
    <input id="linn" name="linn" type="text" placeholder="nt Tallinn"><br><br>
    <label for="postiindeks">Postiindeks </label><br>
    <input id="postiindeks" name="postiindeks" type="number" placeholder="nt 10101"><br><br>
    <label for="riik">Riik </label><br>
    <input id="riik" name="riik" type="text" placeholder="Eesti" disabled><br><br>
  </fieldset>
</form>

<form action="#" method="post">
  <fieldset>
    <legend>Muu info</legend><br>
    <label id="huvialad">Huvialad </label><br>
    <input type="checkbox" name="Joonistamine"> Joonistamine
    <input type="checkbox" name="Laulmine"> Laulmine
    <input type="checkbox" name="Tantsimine"> Tantsimine
    <input type="checkbox" name="Kokkamine"> Kokkamine <br><br>
    <label for="Perekonnanimi">Perekonnanimi: </label><br>
    <input id="Perekonnanimi" name="Perekonnanimi" type="text"><br><br>
    <label for="date">Sünnikuupäev </label><br>
    <input id="date" name="date" type="date" min="2025-01-01" max="2025-12-31"><br><br>
    <label id="Sugu">Sugu </label><br>
    <input type="radio" name="sugu" value="Naine"> Naine
    <input type="radio" name="sugu" value="Mees" checked> Mees
    <input type="radio" name="sugu" value="Muu" checked> Muu
  </fieldset>
</form>

</body>
</html>
